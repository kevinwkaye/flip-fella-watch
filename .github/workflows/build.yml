name: Build watch face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk flip-fella-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flip-fella-watch
          path: flip-fella-watch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flip Fella Watch build ${{ github.run_number }}
          body: Install flip-fella-watch.apk on the watch over wireless debugging. See the README for steps.
          files: flip-fella-watch.apk
          make_latest: true
