name: Build watch face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the face against Google's Watch Face Format spec
        run: |
          pip install --quiet xmlschema
          git clone --depth 1 --quiet https://github.com/google/watchface /tmp/wff
          python3 - <<'PY'
          import sys, xmlschema
          schema = xmlschema.XMLSchema11('/tmp/wff/third_party/wff/specification/documents/2/watchface.xsd')
          errors = list(schema.iter_errors('app/src/main/res/raw/watchface.xml'))
          for e in errors[:20]:
              print(e.path, e.reason)
          sys.exit(1 if errors else 0)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Strip code and re-sign (Watch Face Format packages carry no code)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/debug/app-debug.apk unsigned.apk
          zip -q -d unsigned.apk classes.dex 'META-INF/*'
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks app/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out flip-fella-watch.apk aligned.apk
          "$BT/apksigner" verify flip-fella-watch.apk
          unzip -l flip-fella-watch.apk | grep -c classes.dex && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: flip-fella-watch
          path: flip-fella-watch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flip Fella Watch build ${{ github.run_number }}
          body: Install flip-fella-watch.apk on the watch with Bugjaeger over wireless debugging. See the README for steps.
          files: flip-fella-watch.apk
          make_latest: true
